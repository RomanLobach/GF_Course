[platformio]
default_envs = trigger

[esp32_base]
platform = espressif32@6.9.0
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.19
build_flags = -Wall -Wextra

[env:trigger]
extends = esp32_base
build_src_filter = -<*> +<trigger/>
board_build.filesystem = littlefs
build_flags =
    ${esp32_base.build_flags}
    -DARM_DELAY_MS=5000UL
    -DVBUS_DIVIDER_RATIO=2.0f

; бойова затримка постановки в arm — 5 хв
[env:trigger_prod]
extends = env:trigger
build_flags =
    ${esp32_base.build_flags}
    -DARM_DELAY_MS=300000UL
    -DVBUS_DIVIDER_RATIO=2.0f

[env:sensor]
extends = esp32_base
build_src_filter = -<*> +<sensor/>

; юніт-тести автомата на хості: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<trigger/trigger_fsm.cpp> +<trigger/dual_sensor.cpp>
build_flags =
    -std=gnu++17 -Wall -Wextra
    -Isrc/trigger -Ilib/common
    -DUNIT_TEST
