; PlatformIO project for the LoRa/FSK benchmark practicum firmware.
; Two identical devices (Base / Rover) share this firmware; the role is
; picked at build time via -D DEVICE_ROLE_BASE / -D DEVICE_ROLE_ROVER.
;
;   pio run -e base  -t upload    ; flash the Base unit
;   pio run -e rover -t upload    ; flash the Rover unit

[platformio]
default_envs = base, rover

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The Serial console (type `help`) reads a line per LF and doesn't echo - the monitor does.
monitor_echo = yes
monitor_eol = LF
; Firmware version/hash come from git (hw6-v* tags) via -D macros - see scripts/version.py.
extra_scripts = pre:scripts/version.py
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -Wall
  -Wextra
;  -D APP_DEBUG_SERIAL   ; uncomment to start the system log at DEBUG level (or: `log level debug`)
lib_deps =
  jgromes/RadioLib @ ^6.6.0
  olikraus/U8g2 @ ^2.35.19
; U8g2 (not Adafruit_GFX/Adafruit_SSD1306) drives the OLED - its bitmap fonts
; ship ready-made Cyrillic glyph sets (e.g. u8g2_font_5x7_t_cyrillic), and its
; print()/drawUTF8() decode UTF-8 input directly. Adafruit_GFX's built-in font
; only covers ASCII/CP437, which is why the (Ukrainian) menu text rendered as
; garbage bytes under it - see Display.cpp.
;
; Logs live on the ESP32's own internal flash via LittleFS (FlashLog.cpp) - no
; external storage libraries are needed.
;
; Wi-Fi credentials are NOT in the repo: they live in include/secrets.h (git-ignored,
; copy include/secrets.example.h once). Builds and uploads need no extra steps.

; Fixed USB-serial identities for the two physical boards - each board keeps
; its adapter's serial number stable across replug/reboot, so pinning these
; here means `pio run -e base -t upload` / `-e rover -t upload` always hit the
; correct physical unit without having to pick a /dev/cu.* port by hand.
[env:base]
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE_BASE
upload_port = /dev/cu.usbserial-59260139821
monitor_port = /dev/cu.usbserial-59260139821

[env:rover]
build_flags =
  ${env.build_flags}
  -D DEVICE_ROLE_ROVER
upload_port = /dev/cu.usbserial-58EF0800971
monitor_port = /dev/cu.usbserial-58EF0800971
