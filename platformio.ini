; HW9: ESP32-C6 як companion computer для ArduPilot (MAVLink -> CSV -> Wi-Fi)

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
board_build.mcu = esp32c6
board_build.flash_size = 4MB
board_build.filesystem = littlefs

monitor_speed = 115200

lib_deps =
    https://github.com/mavlink/c_library_v2.git

; логи йдуть у вбудований USB (CDC), UART1 вільний під MAVLink
build_flags =
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; піни UART до польотника, за потреби змінити тут:
    ; -DMAV_RX_PIN=7
    ; -DMAV_TX_PIN=6
