; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
monitor_speed = 115200

; Частина 1: дві задачі + Queue (src/main.cpp)
[env:ttgo-lora32-v1]
build_src_filter = +<*> -<mutex_deadlock.cpp> -<lora_async.cpp>

; Частина 2: навмисний deadlock через mutex + Task Watchdog (src/mutex_deadlock.cpp)
[env:deadlock]
build_src_filter = +<*> -<main.cpp> -<lora_async.cpp>

; Бонус: асинхронна LoRa-передача (src/lora_async.cpp)
[env:lora-async]
build_src_filter = +<*> -<main.cpp> -<mutex_deadlock.cpp>
lib_deps = jgromes/RadioLib@^6.6
